<tr>
    {% for empresa, mensajes_ia in datos %}
    <tr>
        <td>{{ empresa.waba_id }}</td>
        <td>{{ empresa.telefono_id }}</td>
        <td>{% if empresa.activo %}Activo{% else %}Inactivo{% endif %}</td>
        <td>{{ mensajes_ia }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="4">No hay empresas registradas.</td>
    </tr>
    {% endfor %}
</tr>
